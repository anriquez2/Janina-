<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ich habe dich sehr lieb ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #fff0f5 0%, #ffd6e7 100%);
      font-family: 'Comic Sans MS', 'Quicksand', 'Arial Rounded MT Bold', sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    .heart-wrapper {
      position: relative;
      width: 155px;
      height: 155px;
      animation: heartbeat 1.5s ease-in-out infinite;
      filter: drop-shadow(0 16px 28px rgba(255, 90, 150, 0.45));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .heart-wrapper:hover { transform: scale(1.13); }
    .heart-svg { width: 100%; height: 100%; fill: #ff4d79; }
    .face {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      width: 75px;
      height: 40px;
      pointer-events: none;
    }
    .eye {
      position: absolute;
      width: 13px;
      height: 17px;
      background-color: #3b2127;
      border-radius: 50%;
      top: 2px;
      animation: blink 3.2s infinite;
    }
    .eye::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      background-color: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
    }
    .eye.left { left: 10px; }
    .eye.right { right: 10px; }
    .blush {
      position: absolute;
      width: 15px;
      height: 10px;
      background-color: #ff9bb2;
      border-radius: 50%;
      top: 18px;
      opacity: 0.85;
    }
    .blush.left { left: 3px; }
    .blush.right { right: 3px; }
    .mouth {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 13px;
      height: 7px;
      border-bottom: 3.5px solid #3b2127;
      border-radius: 0 0 12px 12px;
    }
    .message {
      margin-top: 32px;
      color: #b53864;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      animation: float-text 2.6s ease-in-out infinite;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.8);
      text-align: center;
    }
    .sub-message {
      margin-top: 8px;
      color: #db6a94;
      font-size: 0.95rem;
      text-align: center;
    }
    .couple-pop {
      position: absolute;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: float-couple 1.9s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      filter: drop-shadow(0 8px 18px rgba(255, 120, 160, 0.4));
      z-index: 50;
    }
    .couple-item {
      font-size: 42px;
      display: inline-block;
      animation: wiggle 0.6s ease-in-out infinite alternate;
    }
    .couple-heart {
      font-size: 26px;
      animation: pulse-heart 0.5s ease-in-out infinite alternate;
    }
    .floating-heart {
      position: absolute;
      pointer-events: none;
      animation: burst-fade 1.4s ease-out forwards;
      z-index: 40;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12) rotate(-2deg); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08) rotate(2deg); }
      60% { transform: scale(1); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes float-text {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes float-couple {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) translateY(20px); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) translateY(-15px); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05) translateY(-50px); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9) translateY(-110px); }
    }
    @keyframes wiggle {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }
    @keyframes pulse-heart {
      from { transform: scale(0.9); }
      to { transform: scale(1.25); }
    }
    @keyframes burst-fade {
      0% { opacity: 1; transform: translate(0, 0) scale(0.4); }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.3) rotate(var(--rot)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart-wrapper" id="heart">
      <svg class="heart-svg" viewBox="0 0 32 32">
        <path d="M16 29s-13-8.2-13-17a7.5 7.5 0 0 1 13-4.8A7.5 7.5 0 0 1 29 12c0 8.8-13 17-13 17z"/>
      </svg>
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <div class="message">Ich habe dich sehr lieb ❤️</div>
    <div class="sub-message">🐰 Klick mich! 🦁</div>
  </div>
  <script>
    const heartEmojis = ['💖', '💕', '💗', '💓', '✨', '🌸', '💘'];
    document.addEventListener('click', (e) => {
      spawnCouple(e.clientX, e.clientY);
      spawnHearts(e.clientX, e.clientY);
    });
    function spawnCouple(x, y) {
      const couple = document.createElement('div');
      couple.className = 'couple-pop';
      couple.style.left = `${x}px`;
      couple.style.top = `${y}px`;
      couple.innerHTML = `
        <span class="couple-item">🐰</span>
        <span class="couple-heart">💖</span>
        <span class="couple-item">🦁</span>
      `;
      document.body.appendChild(couple);
      setTimeout(() => couple.remove(), 1900);
    }
    function spawnHearts(x, y) {
      const count = 10;
      for (let i = 0; i < count; i++) {
        const h = document.createElement('span');
        h.className = 'floating-heart';
        h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        h.style.left = `${x}px`;
        h.style.top = `${y}px`;
        h.style.fontSize = `${18 + Math.random() * 14}px`;
        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4 - 0.2);
        const distance = 60 + Math.random() * 80;
        const rot = `${(Math.random() - 0.5) * 60}deg`;
        h.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
        h.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
        h.style.setProperty('--rot', rot);
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1400);
      }
    }
  </script>
</body>
</html>
